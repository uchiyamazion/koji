<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>着工届・完了届・作業員名簿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Noto+Serif+JP:wght@400;600&display=swap">
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#1d2a35;--sub:#5b6b78;--line:#cfd9e1;--acc:#2f5d7c;--accink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a21;--panel:#1b262f;--ink:#e6edf2;--sub:#9fb0bd;--line:#33434f;--acc:#6aa6cc;--accink:#0f1a22}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic","Hiragino Sans",sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:320px 1fr;gap:16px;max-width:1280px;margin:0 auto;padding:16px}
@media(max-width:860px){.app{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
h1{font-size:16px;margin:0 0 10px}
h2{font-size:13px;margin:14px 0 6px;color:var(--sub)}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 2px}
.panel input,.panel textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.panel input:focus,.panel textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--sub);margin:6px 0 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tabs button,.btn{padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.tabs .print{margin-left:auto;background:var(--acc);color:var(--accink);border-color:var(--acc)}
.stage{overflow-x:auto}
.sheet{display:none;background:#fff;color:#000;margin:0 auto;padding:20mm 18mm;font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN",serif;box-shadow:0 1px 6px rgba(0,0,0,.18)}
.sheet.on{display:block}
.sheet.doc{width:210mm;min-height:297mm}
.sheet.roster{width:297mm;min-height:210mm;padding:12mm 10mm}
.sheet h3{text-align:center;font-size:24px;letter-spacing:.6em;margin:0 0 14mm;font-weight:600}
.sheet .r{text-align:right;line-height:1.9}
.sheet .to{font-size:16px;margin:8mm 0 8mm}
.sheet p.body{line-height:2;margin:6mm 0}
.sheet table.k{width:100%;border-collapse:collapse;margin-top:6mm}
.sheet table.k th,.sheet table.k td{border:1px solid #000;padding:9px 10px;text-align:left;vertical-align:middle}
.sheet table.k th{width:30%;background:#f3f3f3;font-weight:600}
.sheet table.k td{height:13mm;white-space:pre-wrap}
.ros-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:13px}
.ros-head h3{margin:0;font-size:20px;letter-spacing:.4em}
table.ros{width:100%;border-collapse:collapse;font-size:12px}
table.ros th,table.ros td{border:1px solid #000;padding:0;text-align:center}
table.ros th{background:#f3f3f3;padding:5px 3px;font-weight:600}
table.ros input{width:100%;border:0;padding:7px 4px;font:inherit;background:transparent;color:#000;text-align:center}
table.ros td.age{padding:0 6px;width:40px}
table.ros button{border:0;background:none;color:#a33;cursor:pointer;font-size:14px}
.addrow{margin-top:8px}
.sel{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit}
.lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}
.lock.hide{display:none}
table.ros tr.off{opacity:.45}
@page{size:A4}
@page roster{size:A4 landscape}
.sheet.roster{page:roster}
@media print{
 html,body{background:#fff}
 .app{display:block;padding:0;max-width:none}
 .panel,.tabs,.noprint,.lock{display:none!important}
 table.ros tr.off{display:none}
 .stage{overflow:visible}
 .sheet{box-shadow:none;margin:0}
 .sheet.doc{width:auto;min-height:0;padding:0}
 .sheet.roster{width:auto;min-height:0;padding:0}
}
</style>
</head>
<body>
<div class="lock" id="lock"><div class="panel" style="width:min(320px,90vw)"><h1>ログイン</h1><label for="lpw">パスワード</label><input type="password" id="lpw" autocomplete="current-password"><button class="btn" id="lgo" style="margin-top:10px;width:100%">入る</button><p class="hint" id="lmsg"></p></div></div>
<div class="app">
<div class="panel">
 <h1>工事</h1>
 <select id="sel" class="sel" aria-label="工事を選ぶ"></select>
 <div class="two" style="margin-top:8px"><button class="btn" id="sv">保存</button><button class="btn" id="del">削除</button></div>
 <div class="hint" id="st"></div>
 <h2>工事の情報（3書類に共通）</h2>
 <p class="hint" style="margin-top:0">入力すると3つの書類すべてに反映されます。「保存」でスプレッドシートに保存されます。</p>
 <div id="form"></div>
 <p class="hint">作業員は全工事共通のマスタです。工事ごとに「載せる」にチェックした人だけが名簿に出ます。</p>
</div>
<div>
 <div class="tabs" id="tabs">
  <button data-t="a" class="on">着工届</button>
  <button data-t="b">完了届</button>
  <button data-t="c">作業員名簿</button>
  <button class="print" id="pr">この書類を印刷・PDF保存</button>
 </div>
 <div class="stage">
  <div class="sheet doc on" id="sa"></div>
  <div class="sheet doc" id="sb"></div>
  <div class="sheet roster" id="sc">
   <div class="ros-head"><h3>作 業 員 名 簿</h3><div id="rh" style="text-align:right;line-height:1.7"></div></div>
   <table class="ros"><thead><tr><th class="noprint" style="width:40px">載せる</th><th style="width:30px">No</th><th>氏名</th><th>生年月日</th><th>年齢</th><th>職種</th><th>資格・免許</th><th>雇入年月日</th><th>健康診断日</th><th>社会保険</th><th>緊急連絡先</th><th class="noprint" style="width:28px"></th></tr></thead><tbody id="tb"></tbody></table>
   <button class="btn addrow noprint" id="add">＋ 行を追加</button>
  </div>
 </div>
</div>
</div>
<datalist id="ins"><option value="健保・厚年・雇用"><option value="国保・国年・雇用"><option value="一人親方"></datalist>
<datalist id="job"><option value="電気工事士"><option value="配管工"><option value="空調設備工"><option value="冷媒回収作業者"><option value="監督員"></datalist>
<script>
const API='ここにGASのウェブアプリURLを貼る';
const CO='シオンテクノス株式会社';
const FS=[['to','提出先（元請・発注者）','text','○○建設株式会社'],['client','発注者','text',''],['name','工事名','text',''],['place','工事場所','text',''],
['start','着工日','date'],['end','完工予定日','date'],['done','完了日（空欄なら完工予定日）','date'],['handover','検査・引渡し予定日','date'],
['agent','現場代理人','text',''],['chief','主任技術者','text',''],['qual','主任技術者の資格','text','例：1級電気工事施工管理技士'],
['issued','届出日（空欄なら今日）','date'],['addr','会社所在地','text','札幌市'],['rep','代表者名','text',''],['notes','備考','area']];
const EMPTY={addr:'札幌市'};
let S={...EMPTY},W=[],P=[],PW=sessionStorage.getItem('sion_pw')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const copy=o=>JSON.parse(JSON.stringify(o));
function wa(v){const d=v?new Date(v+'T00:00:00'):null;if(!d||isNaN(d))return '令和　　年　　月　　日';const y=d.getFullYear()-2018;return '令和'+(y===1?'元':y)+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function age(b){if(!b)return '';const d=new Date(b+'T00:00:00'),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>=0&&a<120?a:''}
function term(){const s=S.start,e=S.end;let t=wa(s)+' から '+wa(e)+' まで';if(s&&e){const n=Math.round((new Date(e)-new Date(s))/864e5)+1;if(n>0)t+='（'+n+'日間）'}return t}

async function api(action,data){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...data,pw:PW,action})});
 const j=await r.json();
 if(j.error==='unauthorized'){sessionStorage.removeItem('sion_pw');showLock('パスワードが違います');throw new Error('unauthorized')}
 if(j.error)throw new Error(j.error);
 return j}
function showLock(m){$('lock').classList.remove('hide');$('lmsg').textContent=m||''}
async function load(){
 try{const j=await api('list');P=j.projects;W=j.workers;if(!W.length)W=[{id:nid()}];
  $('lock').classList.add('hide');fillSel();buildForm();buildRoster();render()}
 catch(e){if(e.message!=='unauthorized')showLock('接続できません：'+e.message)}}
$('lgo').onclick=()=>{PW=$('lpw').value;sessionStorage.setItem('sion_pw',PW);load()};
$('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')$('lgo').click()});

function fillSel(){$('sel').innerHTML='<option value="">（新しい工事）</option>'+P.map(p=>`<option value="${esc(p.id)}">${esc(p.name||'（無題）')}</option>`).join('');$('sel').value=S.id||''}
function openProject(p){S=p?copy(p):{...EMPTY};fillSel();buildForm();buildRoster();render()}
$('sel').onchange=()=>openProject(P.find(x=>x.id===$('sel').value));
$('sv').onclick=async()=>{
 if(!S.name){alert('工事名を入力してください');return}
 if(!S.id)S.id=nid();S.ws=S.ws||[];S.updated=new Date().toISOString();
 $('st').textContent='保存中…';
 try{await api('saveProject',{project:S});await api('saveWorkers',{workers:W});
  const i=P.findIndex(p=>p.id===S.id);if(i<0)P.unshift(copy(S));else P[i]=copy(S);
  fillSel();$('st').textContent='保存しました'}
 catch(e){$('st').textContent='保存に失敗：'+e.message}};
$('del').onclick=async()=>{
 if(!S.id){openProject(null);return}
 if(!confirm('この工事を削除しますか？（作業員マスタは残ります）'))return;
 try{await api('deleteProject',{id:S.id});P=P.filter(p=>p.id!==S.id);openProject(null);$('st').textContent='削除しました'}
 catch(e){$('st').textContent='削除に失敗：'+e.message}};

function buildForm(){
 $('form').innerHTML=FS.map(([k,l,t,p])=>t==='area'?`<label>${l}</label><textarea rows="2" data-k="${k}"></textarea>`:`<label>${l}</label><input type="${t}" data-k="${k}" placeholder="${p||''}">`).join('');
 document.querySelectorAll('[data-k]').forEach(el=>{el.value=S[el.dataset.k]||'';el.addEventListener('input',()=>{S[el.dataset.k]=el.value;render()})})}
const row=(l,v)=>`<tr><th>${l}</th><td>${esc(v)}</td></tr>`;
function head(title,text){const d=wa(S.issued||today());return `<h3>${title}</h3><div class="r">${d}</div>
<div class="to">${esc(S.to)||'　　　　　　'}　御中</div>
<div class="r">${esc(S.addr)}<br>${CO}<br>代表者　${esc(S.rep)}　　　　　印</div>
<p class="body">${text}</p>`}
function render(){
 const done=S.done||S.end;
 $('sa').innerHTML=head('着 工 届','下記の工事について、'+wa(S.start)+'に着工しましたので、お届けいたします。')+'<div style="text-align:center;margin-top:8mm">記</div><table class="k">'+row('工事名',S.name)+row('工事場所',S.place)+row('発注者',S.client)+row('工期',term())+row('現場代理人',S.agent)+row('主任技術者',(S.chief||'')+(S.qual?'（'+S.qual+'）':''))+row('備考',S.notes)+'</table>';
 $('sb').innerHTML=head('完 了 届','下記の工事は、'+wa(done)+'に完了しましたので、お届けいたします。')+'<div style="text-align:center;margin-top:8mm">記</div><table class="k">'+row('工事名',S.name)+row('工事場所',S.place)+row('発注者',S.client)+row('工期',term())+row('完了日',wa(done))+row('検査・引渡し予定日',S.handover?wa(S.handover):'')+row('現場代理人',S.agent)+row('備考',S.notes)+'</table>';
 $('rh').innerHTML='工事名：'+esc(S.name)+'<br>会社名：'+CO+'<br>作成日：'+wa(S.issued||today());
}

function buildRoster(){
 S.ws=S.ws||[];
 $('tb').innerHTML=W.map((r,i)=>`<tr data-i="${i}"><td class="noprint"><input type="checkbox" data-c aria-label="この工事の名簿に載せる"${S.ws.includes(r.id)?' checked':''}></td><td class="no"></td>`+
 `<td><input data-f="n" value="${esc(r.n)}"></td><td><input type="date" data-f="b" value="${esc(r.b)}"></td><td class="age">${age(r.b)}</td>`+
 `<td><input data-f="j" list="job" value="${esc(r.j)}"></td><td><input data-f="q" value="${esc(r.q)}"></td>`+
 `<td><input type="date" data-f="h" value="${esc(r.h)}"></td><td><input type="date" data-f="m" value="${esc(r.m)}"></td>`+
 `<td><input data-f="i" list="ins" value="${esc(r.i)}"></td><td><input data-f="t" value="${esc(r.t)}"></td>`+
 `<td class="noprint"><button title="マスタから削除" data-d="${i}">×</button></td></tr>`).join('');
 renum()}
function renum(){let n=0;$('tb').querySelectorAll('tr').forEach(tr=>{const on=tr.querySelector('[data-c]').checked;tr.classList.toggle('off',!on);tr.querySelector('.no').textContent=on?++n:''})}
$('tb').addEventListener('input',e=>{
 const tr=e.target.closest('tr');if(!tr)return;const w=W[+tr.dataset.i];
 if(e.target.dataset.c!==undefined){S.ws=S.ws.filter(x=>x!==w.id);if(e.target.checked)S.ws.push(w.id);renum();return}
 const f=e.target.dataset.f;if(!f)return;w[f]=e.target.value;if(f==='b')tr.querySelector('.age').textContent=age(e.target.value)});
$('tb').addEventListener('click',e=>{const d=e.target.dataset.d;if(d==null)return;
 if(!confirm('この作業員をマスタから削除しますか？（保存すると他の工事の名簿からも消えます）'))return;
 const w=W.splice(+d,1)[0];S.ws=S.ws.filter(x=>x!==w.id);if(!W.length)W.push({id:nid()});buildRoster()});
$('add').onclick=()=>{const w={id:nid()};W.push(w);S.ws.push(w.id);buildRoster()};
$('tabs').addEventListener('click',e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('.tabs [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['a','b','c'].forEach(x=>$('s'+x).classList.toggle('on',x===t))});
$('pr').onclick=()=>window.print();
if(PW)load();else showLock('');
</script>
</body>
</html>
